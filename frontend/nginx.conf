server {
    listen 80;
    server_name _;

    # Raiz donde nginx busca los archivos estaticos del build de Angular
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────────────────
    # Proxy inverso hacia la API de FastAPI
    #
    # Cuando el frontend hace una llamada a /api/carrito/..., nginx intercepta
    # el request, elimina el prefijo /api y lo redirige al servicio 'api' de
    # docker-compose en el puerto 8000.
    #
    # Por que esto evita CORS:
    # Sin el proxy, el navegador en http://frontend:4200 hace un request a
    # http://api:8000 (diferente origen). El navegador bloquea requests cross-
    # origin a menos que el servidor incluya las cabeceras CORS. Con el proxy,
    # el navegador hace el request a http://frontend:4200/api (mismo origen),
    # nginx hace la solicitud backend-to-backend (sin restricciones CORS), y
    # devuelve la respuesta. El navegador nunca sabe que hay un backend separado.
    #
    # proxy_set_header: nginx por defecto no forwardea el Host original.
    # Seteamos X-Real-IP para que FastAPI pueda loguear la IP del cliente real,
    # no la IP de nginx.
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Routing de la SPA (Single Page Application) de Angular
    #
    # Angular usa routing del lado del cliente: la URL /carrito/detalle no es un
    # archivo en el servidor; es una ruta que Angular maneja internamente.
    #
    # Sin esta configuracion, un usuario que va directamente a /carrito recibiria
    # un 404 de nginx porque no hay un archivo /carrito en el servidor.
    #
    # try_files intenta en orden:
    # 1. $uri: el archivo literal (para CSS, JS, favicon, etc.)
    # 2. $uri/: el directorio (para /assets/)
    # 3. /index.html: si los anteriores no existen, sirve index.html.
    #    Angular se inicializa y su router lee la URL para mostrar la ruta correcta.
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad recomendadas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache de archivos estaticos con hash (generados por Angular con outputHashing)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
