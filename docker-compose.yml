services:
  db:
    image: postgres:16-alpine
    container_name: tiendauv_db
    environment:
      POSTGRES_USER: tiendauv
      POSTGRES_PASSWORD: tiendauv_pass
      POSTGRES_DB: tiendauv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiendauv"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiendauv_api
    environment:
      DATABASE_URL: postgresql://tiendauv:tiendauv_pass@db:5432/tiendauv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiendauv_frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    environment:
      # La URL de la API la maneja nginx internamente (proxy_pass http://api:8000/)
      # No necesita setearse como variable de entorno aqui porque nginx.conf
      # usa el nombre del servicio 'api' de docker-compose directamente.
      API_URL: http://api:8000

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
